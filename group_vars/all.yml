---
# ── Cluster identity ────────────────────────────────────────────────────────
slurm_cluster_name:  "mycluster"
slurm_partition_name: "gpu"

# ── Accounting (requires MariaDB + slurmdbd on login node) ─────────────────
# DB password lives in vault/secrets.yml, never here.
slurm_accounting: true
slurm_db_name:     "slurm_acct_db"
slurm_db_user:     "slurm"

# ── Slurm cgroup plugin (cgroup/v2 is default on Ubuntu 24.04) ─────────────
slurm_cgroup_plugin: "cgroup/v2"

# ── NVIDIA driver ───────────────────────────────────────────────────────────
# Branch number only (e.g. 550, 535).  Package installed: nvidia-driver-<branch>
nvidia_driver_branch: "550"
# Set to false during development to skip the post-install reboot.
nvidia_reboot_after_install: true

# ── NFS exports ────────────────────────────────────────────────────────────
nfs_export_home:   "/home"
nfs_export_shared: "/opt/shared"
# Restrict exports to the cluster's private subnet.
nfs_subnet: "192.168.2.0/24"

# ── Cluster OS users with pinned UIDs ──────────────────────────────────────
# UIDs must be identical on every node so NFS-mounted home dirs work.
# Add entries here; re-run the playbook to provision new users everywhere.
cluster_users:
  - name: alice
    uid: 2001
  - name: bob
    uid: 2002
