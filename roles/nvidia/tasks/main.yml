---
- name: Install kernel headers and build tools (needed by DKMS)
  apt:
    name:
      - "linux-headers-{{ ansible_facts['kernel'] }}"
      - gcc
      - make
      - dkms
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install NVIDIA driver (branch {{ nvidia_driver_branch }})
  apt:
    name:
      - "nvidia-driver-{{ nvidia_driver_branch }}"
      - "nvidia-utils-{{ nvidia_driver_branch }}"
    state: present
  register: nvidia_driver_install

# A reboot is required after the first driver install for the kernel module
# to load and /dev/nvidia* devices to appear.  Subsequent runs are no-ops
# because nvidia_driver_install.changed is false.
- name: Reboot to load NVIDIA kernel module
  reboot:
    reboot_timeout: 300
    post_reboot_delay: 30
    msg: "Ansible rebooting to load nvidia-driver-{{ nvidia_driver_branch }}"
  when:
    - nvidia_reboot_after_install | bool
    - nvidia_driver_install.changed
