---
- name: Install munge
  apt:
    name: munge
    state: present
    update_cache: true
    cache_valid_time: 3600

# ── Key generation (login node only) ───────────────────────────────────────
# mungekey --create is idempotent via `creates:`.  Runs only if the key file
# is absent, so a pre-existing key is never overwritten on re-runs.
- name: Create munge key store directory on Ansible controller
  file:
    path: "{{ playbook_dir }}/.munge"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Generate munge key on login node
  command: mungekey --create
  args:
    creates: /etc/munge/munge.key
  when: inventory_hostname in groups['login']

- name: Fetch munge key from login node to Ansible controller
  fetch:
    src: /etc/munge/munge.key
    dest: "{{ playbook_dir }}/.munge/munge.key"
    flat: true
  when: inventory_hostname in groups['login']

# ── Key distribution (all nodes) ───────────────────────────────────────────
# The identical key fetched above is pushed to every node (including login
# itself on re-runs, which is a no-op when the key hasn't changed).
- name: Push munge key to node
  copy:
    src: "{{ playbook_dir }}/.munge/munge.key"
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: "0400"
  notify: restart munge

- name: Enable and start munge
  systemd:
    name: munge
    enabled: true
    state: started
