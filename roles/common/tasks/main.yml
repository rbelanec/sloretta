---
- name: Update apt cache and upgrade all packages
  apt:
    update_cache: true
    upgrade: dist

- name: Install base packages
  apt:
    name:
      - chrony
      - curl
      - wget
      - vim
      - htop
      - rsync
      - zsh
      - tmux
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start chrony (NTP — required for munge clock-skew tolerance)
  systemd:
    name: chrony
    enabled: true
    state: started

- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Render /etc/hosts for the whole cluster
  template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

- name: Create cluster users
  user:
    name: "{{ item }}"
    shell: /bin/bash
    create_home: true
    state: present
  loop: "{{ cluster_users }}"
