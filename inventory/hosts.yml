---
all:
  vars:
    ansible_user: root

# ── Login node ──────────────────────────────────────────────────────────────
# Set ansible_host to the floating IP. slurm_private_ip is the address
# used for NFS mounts and /etc/hosts (the private-network address).
#
# If you run Ansible directly ON the login node (control == login):
#   1. Uncomment ansible_connection: local below.
#   2. In group_vars/compute.yml, comment out ansible_ssh_common_args —
#      the login node reaches compute nodes directly on the private network.
login:
  hosts:
    login01:
      ansible_host: "203.0.113.10"        # ← replace with your floating IP
      slurm_private_ip: "192.168.1.10"
      # ansible_connection: local         # ← uncomment when control == login

# ── Compute / GPU nodes ─────────────────────────────────────────────────────
# These have no floating IP.  ansible_host is the private-network address.
# Ansible reaches them via ProxyJump through login01 (see group_vars/compute.yml).
#
# Required per-host vars:
#   ansible_host       - private IP (used for SSH via proxy)
#   slurm_private_ip   - same private IP (used in /etc/hosts and NFS)
#   slurm_gpu_count    - integer, number of GPUs on this node
#   slurm_gpu_type     - string, e.g. a100, v100, h100
#
# Optional overrides (if absent, gathered from Ansible facts):
#   slurm_node_cpus    - total logical CPUs for slurm.conf NodeName line
#   slurm_node_memory  - RealMemory (MB) for slurm.conf NodeName line
compute:
  hosts:
    gpu01:
      ansible_host: "192.168.1.20"
      slurm_private_ip: "192.168.1.20"
      slurm_gpu_count: 4
      slurm_gpu_type: "a100"
      # slurm_node_cpus: 64
      # slurm_node_memory: 450000

    gpu02:
      ansible_host: "192.168.1.21"
      slurm_private_ip: "192.168.1.21"
      slurm_gpu_count: 4
      slurm_gpu_type: "a100"
      # slurm_node_cpus: 64
      # slurm_node_memory: 450000
